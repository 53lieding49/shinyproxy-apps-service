apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: shinyproxy-apps
  name: shinyproxy-pod-creator
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: shinyproxy-apps
  name: shinyproxy-pod-creator-binding
subjects:
- kind: ServiceAccount
  name: default
  namespace: shinyproxy-apps
roleRef:
  kind: Role
  name: shinyproxy-pod-creator
  apiGroup: rbac.authorization.k8s.io
